availableFrameworks:
  - SPRING
  - DROPWIZARD

availableMocks:
  - EXTERNAL_SERVICES
  - REDIS
  - MYSQL
  - LOCALSTACK
  - SOLR
  - ZOOKEEPER
  - KAFKA
  - POSTGRESQL
  - OPENSEARCH

profileConfig:
  LOCAL:
    dockerHost: 0.0.0.0
  CI:
    dockerHost: docker

globalMocks:
  routes:
    - type: threepio
      resourcePath: mocks/global
      folderName: threepio-service
      fileNames:
        - olxin.json
        - threepio.js
      endpoints:
        - methodType: GET
          path: /threepio/v1/projects/:projectId/files
          method: getTranslationFileV1

serviceDefaults:
  externalServices:
    port: 31270
  redis:
    port: 6379
    image: redis:7.4
  toxiproxy:
    port: 8474
  mysql:
    port: 3306
    image: mysql:8.4
  localstack:
    image: localstack/localstack:3.8
    port: 4566
    services:
      - s3
    region: us-east-1
  solr:
    image: solr:9.7
    port: 8983
  zookeeper:
    image: wurstmeister/zookeeper
    port: 2181
  kafka:
    image: wurstmeister/kafka
    port: 9093
  postgresql:
    port: 5432
    image: postgres:16
  opensearch:
    port: 9200
    image: opensearchproject/opensearch:2.2.0
